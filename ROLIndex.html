  .btnwrap::before{content:"";position:absolute;inset:0;border-radius:18px;

    transform:translateX(-150%) skewX(-20deg);animation:shine 2.6s ease-in-out infinite}
  @keyframes shine{55%,100%{transform:translateX(350%) skewX(-20deg)}}

<script>
(function(){
  /* ✏️ Ajustes */
  var EMOJIS = ['⚓','🚢','🏰','📜','⚔️','🌍','🎩','🕰️','🗺️','👑','🔥'];
  var MS = 1200;                                   // animación del botón (ms)
  var weak = (navigator.deviceMemory && navigator.deviceMemory <= 4) ||
             (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
  var COUNT = weak ? 12 : 18;                      // menos emojis en móviles modestos

  function R(a,b){ return a + Math.random()*(b-a); }

  /* Lluvia: se crea tras el primer pintado para que la página aparezca al instante.
     Una sola animación por emoji (caída + giro) = mínima carga. */
  function startRain(){
    var rain = document.getElementById('rain'), frag = document.createDocumentFragment();
    for (var k = 0; k < COUNT; k++){
      var d = document.createElement('div');
      var dur = R(8000,15000), sway = R(-40,40), rot = R(30,160);
      d.className = 'e';
      d.textContent = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
      d.style.left = R(1,92).toFixed(1) + '%';
      d.style.fontSize = R(22,40).toFixed(0) + 'px';
      d.style.opacity = R(.6,.95).toFixed(2);
      frag.appendChild(d);
      if (d.animate){
        d.animate([
          {transform:'translate3d(0,-15vh,0) rotate('+(-rot)+'deg) scale(.9)'},
          {transform:'translate3d('+sway+'px,30vh,0) rotate('+(rot*.5)+'deg) scale(1.1)'},
          {transform:'translate3d('+(-sway)+'px,65vh,0) rotate('+(-rot*.5)+'deg) scale(.95)'},
          {transform:'translate3d(0,118vh,0) rotate('+rot+'deg) scale(1.05)'}
        ],{duration:dur,iterations:Infinity,delay:-Math.random()*dur,easing:'linear'});
      } else {
        d.style.top = R(0,90).toFixed(0) + '%';
      }
    }
    rain.appendChild(frag);
  }
  requestAnimationFrame(function(){ setTimeout(startRain, 0); });

  /* Pausa todo cuando la pestaña/app no está visible (ahorra batería y CPU) */
  document.addEventListener('visibilitychange', function(){
    var all = document.getAnimations ? document.getAnimations() : [];
    for (var i = 0; i < all.length; i++){ document.hidden ? all[i].pause() : all[i].play(); }
  });

  /* Botón: animación corta y apertura directa */
  var btn = document.getElementById('join'), status = document.getElementById('status'),
      card = document.getElementById('card'), url = btn.href, busy = false;

  function openLink(){
    try { window.top.location.href = url; return; } catch(e){}
    try { window.location.href = url; return; } catch(e){}
    try { if (window.open(url,'_blank','noopener')) return; } catch(e){}
  }
  btn.addEventListener('click', function(e){
    e.preventDefault();
    if (busy) return; busy = true;
    btn.setAttribute('aria-disabled','true');
    btn.textContent = 'Zarpando… ⚓';
    status.innerHTML = '<span>Redirigiendo de forma segura…</span><div class="bar"><i style="transition-duration:'+MS+'ms"></i></div>';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ card.classList.add('go'); }); });
    setTimeout(openLink, MS);
    setTimeout(function(){
      status.innerHTML = 'Si no se abrió, <a href="'+url+'" target="_blank" rel="noopener noreferrer">toca aquí</a>.';
    }, MS + 2500);
  });
})();
</script>
</body>
</html>
