<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0804">
<title>Únete a ROL MUNDIAL</title>
<meta name="description" content="Pulsa el botón para unirte a ROL MUNDIAL.">
<style>
  :root{ --g1:#b8860b; --g2:#f5c451; --g3:#ffe9b0; --text:#fff8e8; --muted:#d8c9a6; }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);background:#0b0804;overflow:hidden;touch-action:manipulation;
    min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  }
  /* Fondo: foto estática (sin filtros) y velo ya mezclado en una sola capa */
  .bg{position:fixed;inset:0;z-index:0;background:#0b0804 url("fondo.jpg") center top/cover no-repeat;
      transform:translateZ(0);animation:drift 24s ease-in-out infinite alternate;will-change:transform}
  @keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.12)}}
  .veil{position:fixed;inset:0;z-index:1;
    background:
      radial-gradient(80vmax 60vmax at 50% 105%, rgba(245,196,81,.28), transparent 60%),
      linear-gradient(180deg, rgba(10,8,4,.55), rgba(10,8,4,.80))}

  /* Lluvia: solo transform (se ejecuta en la GPU) */
  #rain{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden;contain:strict}
  .e{position:absolute;top:0;left:0;line-height:1;will-change:transform;backface-visibility:hidden}

  .card{
    position:relative;z-index:3;width:100%;max-width:420px;text-align:center;
    background:rgba(20,14,6,.72);border:1px solid rgba(245,196,81,.28);border-radius:26px;
    padding:34px 26px 26px;box-shadow:0 24px 60px rgba(0,0,0,.5);
    animation:in .6s ease both;
  }
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .live{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--g3);background:rgba(245,196,81,.1);border:1px solid rgba(245,196,81,.3);padding:6px 12px;border-radius:99px;margin-bottom:18px}
  .live b{position:relative;width:8px;height:8px;border-radius:50%;background:var(--g2)}
  .live b::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--g2);animation:ping 1.6s ease-out infinite}
  @keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
  h1{font-size:2rem;letter-spacing:.05em;line-height:1.3;padding-top:.1em;margin-bottom:8px;
     background:linear-gradient(90deg,#fff,var(--g3),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
  p.desc{color:var(--muted);line-height:1.55;font-size:1rem;margin-bottom:26px}

  /* Botón: brillo y pulso animan solo transform/opacity */
  .btnwrap{position:relative;animation:bob 2.4s ease-in-out infinite}
  .btnwrap::before{content:"";position:absolute;inset:0;border-radius:18px;
    box-shadow:0 0 34px 6px rgba(245,196,81,.75);opacity:.45;animation:glow 2s ease-in-out infinite}
  @keyframes glow{50%{opacity:1;transform:scale(1.04)}}
  @keyframes bob{50%{transform:translateY(-3px)}}
  .btn{
    position:relative;display:block;width:100%;overflow:hidden;
    padding:20px 24px;border-radius:18px;border:0;cursor:pointer;
    font:inherit;font-size:1.35rem;font-weight:800;letter-spacing:.04em;color:#2a1a00;text-decoration:none;
    background:linear-gradient(120deg,var(--g1),var(--g2) 55%,var(--g3));
    transition:transform .15s ease;-webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.96)}
  .btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);
    transform:translateX(-150%) skewX(-20deg);animation:shine 2.6s ease-in-out infinite}
  @keyframes shine{55%,100%{transform:translateX(350%) skewX(-20deg)}}
  .btn[aria-disabled="true"]{pointer-events:none}

  .status{min-height:3.2em;margin-top:20px;color:var(--muted);font-size:.95rem;line-height:1.5}
  .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin:10px auto 0;max-width:240px;opacity:0;transition:opacity .2s}
  .bar i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;
    background:linear-gradient(90deg,var(--g1),var(--g2));transition:transform 1.2s linear}
  .go .bar{opacity:1}
  .go .bar i{transform:scaleX(1)}
  .status a{color:var(--g2)}
  .foot{margin-top:12px;font-size:.78rem;color:var(--muted);opacity:.85}
  @media (prefers-reduced-motion:reduce){.bg,.btnwrap,.btnwrap::before,.btn::after{animation:none!important}}

  /* Botón de música */
  .snd{position:fixed;z-index:6;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));
    width:46px;height:46px;border-radius:50%;border:1px solid rgba(245,196,81,.45);cursor:pointer;
    background:rgba(20,14,6,.72);color:#fff8e8;font-size:21px;line-height:1;display:grid;place-items:center;
    -webkit-tap-highlight-color:transparent;transition:transform .15s ease}
  .snd:active{transform:scale(.9)}
  .snd.off::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(245,196,81,.7);animation:ping 1.6s ease-out infinite}
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
  <div id="rain" aria-hidden="true"></div>
  <audio id="bgm" src="musica.mp3" loop preload="auto"></audio>
  <button class="snd off" id="snd" type="button" aria-label="Activar o silenciar música">🔇</button>

  <main class="card" id="card">
    <!-- ✏️ EDITA AQUÍ: etiqueta, título y descripción -->
    <div class="live"><b></b>Reclutamiento abierto</div>
    <h1>ROL MUNDIAL</h1>
    <p class="desc">La historia espera ser escrita por ti. Elige tu nación, forja alianzas y cambia el rumbo del mundo.</p>

    <!-- ✏️ EDITA AQUÍ: el enlace de destino (href) y el texto del botón -->
    <div class="btnwrap">
      <a class="btn" id="join" rel="noopener noreferrer"
         href="https://chat.whatsapp.com/KZzgAGoFaqtHA0yhXOVnsd?s=cl&p=a&iam=2">Únete ⚓</a>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"><div class="bar"><i></i></div></div>
    <p class="foot">🔒 Enlace verificado · Redirección segura</p>
  </main>

<script>
(function(){
  /* ✏️ Ajustes */
  var EMOJIS = ['⚓','🚢','🏰','📜','⚔️','🌍','🎩','🕰️','🗺️','👑','🔥'];
  var MS = 1200;                                   // animación del botón (ms)
  var weak = (navigator.deviceMemory && navigator.deviceMemory <= 4) ||
             (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
  var COUNT = weak ? 12 : 18;                      // menos emojis en móviles modestos

  function R(a,b){ return a + Math.random()*(b-a); }

  /* Lluvia: se crea tras el primer pintado para que la página aparezca al instante.
     Una sola animación por emoji (caída + giro) = mínima carga. */
  function startRain(){
    var rain = document.getElementById('rain'), frag = document.createDocumentFragment();
    for (var k = 0; k < COUNT; k++){
      var d = document.createElement('div');
      var dur = R(8000,15000), sway = R(-40,40), rot = R(30,160);
      d.className = 'e';
      d.textContent = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
      d.style.left = R(1,92).toFixed(1) + '%';
      d.style.fontSize = R(22,40).toFixed(0) + 'px';
      d.style.opacity = R(.6,.95).toFixed(2);
      frag.appendChild(d);
      if (d.animate){
        d.animate([
          {transform:'translate3d(0,-15vh,0) rotate('+(-rot)+'deg) scale(.9)'},
          {transform:'translate3d('+sway+'px,30vh,0) rotate('+(rot*.5)+'deg) scale(1.1)'},
          {transform:'translate3d('+(-sway)+'px,65vh,0) rotate('+(-rot*.5)+'deg) scale(.95)'},
          {transform:'translate3d(0,118vh,0) rotate('+rot+'deg) scale(1.05)'}
        ],{duration:dur,iterations:Infinity,delay:-Math.random()*dur,easing:'linear'});
      } else {
        d.style.top = R(0,90).toFixed(0) + '%';
      }
    }
    rain.appendChild(frag);
  }
  requestAnimationFrame(function(){ setTimeout(startRain, 0); });

  /* Pausa todo cuando la pestaña/app no está visible (ahorra batería y CPU) */
  document.addEventListener('visibilitychange', function(){
    var all = document.getAnimations ? document.getAnimations() : [];
    for (var i = 0; i < all.length; i++){ document.hidden ? all[i].pause() : all[i].play(); }
  });


  /* Música: intenta sonar al cargar; si el navegador lo bloquea, suena con el primer toque */
  var a = document.getElementById('bgm'), sb = document.getElementById('snd'), wanted = true, resume = false;
  a.volume = 0.6;
  function ui(){ sb.textContent = a.paused ? '🔇' : '🔊'; sb.classList.toggle('off', a.paused); }
  function tryPlay(){ try { var p = a.play(); if (p && p.catch) p.catch(function(){}); } catch(e){} }
  function unlock(){ if (wanted && a.paused) tryPlay(); }
  var evs = ['click','touchend','keydown'];
  evs.forEach(function(ev){ document.addEventListener(ev, unlock, true); });
  a.addEventListener('playing', function(){ evs.forEach(function(ev){ document.removeEventListener(ev, unlock, true); }); ui(); });
  a.addEventListener('pause', ui);
  sb.addEventListener('click', function(){
    if (a.paused){ wanted = true; tryPlay(); } else { wanted = false; a.pause(); }
  });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ resume = !a.paused; a.pause(); }
    else if (resume && wanted){ tryPlay(); }
  });
  tryPlay(); ui();

  /* Botón: animación corta y apertura directa */
  var btn = document.getElementById('join'), status = document.getElementById('status'),
      card = document.getElementById('card'), url = btn.href, busy = false;

  function openLink(){
    try { window.top.location.href = url; return; } catch(e){}
    try { window.location.href = url; return; } catch(e){}
    try { if (window.open(url,'_blank','noopener')) return; } catch(e){}
  }
  btn.addEventListener('click', function(e){
    e.preventDefault();
    if (busy) return; busy = true;
    btn.setAttribute('aria-disabled','true');
    btn.textContent = 'Zarpando… ⚓';
    status.innerHTML = '<span>Redirigiendo de forma segura…</span><div class="bar"><i style="transition-duration:'+MS+'ms"></i></div>';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ card.classList.add('go'); }); });
    setTimeout(openLink, MS);
    setTimeout(function(){
      status.innerHTML = 'Si no se abrió, <a href="'+url+'" target="_blank" rel="noopener noreferrer">toca aquí</a>.';
    }, MS + 2500);
  });
})();
</script>
</body>
</html>
